<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Prototype Graph Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="css">
/* Layout: full-height editor. Toolbar band on top; a white artboard (the print figure, paper-white in both themes) on a workspace canvas; inspector column on the right that stacks under the canvas on phones. */
:root {
  --bg: #e8ebef;
  --surface: #ffffff;
  --surface-2: #f3f5f7;
  --ink: #1a1e23;
  --ink-2: #59626e;
  --line: #d5dae0;
  --accent: #5a44c8;
  --accent-soft: #ece9fb;
  --danger: #b4232c;
  --warn: #c7771f;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1b1f25; --surface-2: #242a32; --ink: #e5e8ec; --ink-2: #9aa3ae; --line: #303740;
    --accent: #a594ff; --accent-soft: #2a2647; --danger: #ff7c83; --warn: #f0a24e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1b1f25; --surface-2: #242a32; --ink: #e5e8ec; --ink-2: #9aa3ae; --line: #303740;
  --accent: #a594ff; --accent-soft: #2a2647; --danger: #ff7c83; --warn: #f0a24e; color-scheme: dark;
}
[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; }
#root { height: 100%; display: flex; flex-direction: column; }
.bar { background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; margin-right: 4px; }
.grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.grp-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); margin-right: 2px; }
.sep { width: 1px; align-self: stretch; background: var(--line); }
button, .btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; min-height: 30px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.2; white-space: nowrap; }
button:hover, .btn:hover { border-color: var(--ink-2); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .btn:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
button.danger { color: var(--danger); }
button:disabled { opacity: .45; cursor: not-allowed; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); }
.status { margin-left: auto; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.status.dirty::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#cv { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--bg); }
#cv.panning { cursor: grabbing; }
#cv.connect, #cv.connect .nd { cursor: crosshair; }
#cv .nd, #cv [data-legend] { cursor: move; }
#cv .hit { stroke: transparent; stroke-width: 18; fill: none; pointer-events: stroke; cursor: pointer; }
#cv [data-e] { cursor: pointer; }
.ov { pointer-events: none; }
.ov .sel { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 7 5; }
.ov .sel-e { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 9 6; }
.ov .src { fill: none; stroke: var(--accent); stroke-width: 4; }
.ov .pre { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 5 5; }
.ov .drop { fill: var(--accent); fill-opacity: .15; stroke: var(--accent); stroke-width: 4; }
.ov .marq { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
.board { filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .18)); }
.zoom { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; gap: 4px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.zoom output { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); min-width: 46px; text-align: center; }
.hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--ink); color: var(--surface); font-size: 12.5px; padding: 7px 14px; border-radius: 999px; pointer-events: none; text-align: center; }
aside.panel { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px 16px; display: flex; flex-direction: column; gap: 18px; }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 16px; }
.kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 500; }
.panel h2 { font-size: 17px; margin: 0; font-weight: 600; text-wrap: balance; overflow-wrap: anywhere; }
.panel h3 { font-size: 12px; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.field > span.v { font-family: var(--f-mono); color: var(--ink); }
.field .lab { display: flex; justify-content: space-between; gap: 8px; }
input[type="text"], input[type="number"], select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
textarea { resize: vertical; line-height: 1.35; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.mono { font-family: var(--f-mono); }
.chk { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink); cursor: pointer; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font-size: 12.5px; min-height: 26px; padding: 3px 9px; border-radius: 999px; white-space: normal; text-align: left; }
.chips button small { color: var(--ink-2); font-family: var(--f-mono); }
.list { display: flex; flex-direction: column; gap: 4px; }
.list button { justify-content: flex-start; text-align: left; white-space: normal; font-size: 13px; }
.list .cmd { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.thumb { width: 112px; height: 112px; border-radius: 50%; border: 2px solid var(--line); overflow: hidden; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font-size: 12px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; max-width: none; }
.imgrow { display: flex; gap: 14px; align-items: center; }
.imgrow .btnrow { flex-direction: column; align-items: flex-start; }
.note { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin: 0; }
.meta { font-size: 13px; color: var(--ink-2); margin: 0; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
.stats div { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
.stats dt { font-size: 11.5px; color: var(--ink-2); }
.stats dd { margin: 2px 0 0; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tips { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.45; }
.links a { color: var(--accent); font-size: 13px; }
.tray { display: flex; flex-direction: column; gap: 8px; }
.trow { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.trow img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; max-width: none; }
.trow .fname { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.tcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 8px; font-size: 13.5px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0, 0, 0, .25); z-index: 20; }
@media (max-width: 820px) {
  html, body, #root { height: auto; }
  main { display: block; }
  .stage { height: 62vh; }
  aside.panel { border-left: 0; border-top: 1px solid var(--line); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
  .status { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { button { transition: border-color .12s, background-color .12s; } }
</style>

<div id="root">
  <header class="bar">
    <span class="brand">Prototype Graph Editor</span>
    <div class="grp" role="group" aria-label="Tool">
      <button id="b-select" data-act="mode-select" aria-pressed="true" title="Select and move (V)">Select</button>
      <button id="b-connect" data-act="mode-connect" aria-pressed="false" title="Draw a link between two circles (C)">Connect</button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="grp" role="group" aria-label="Add">
      <span class="grp-label">Add</span>
      <button data-act="add-proto">Prototype</button>
      <button data-act="add-ib">In-Between</button>
      <button data-act="add-case">Built case</button>
      <label class="btn" title="Choose many photos at once. Each one goes to the case whose name is in its file name."><input id="f-photos" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>Photos…</label>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="grp" role="group" aria-label="History">
      <button id="b-undo" data-act="undo" title="Undo (Ctrl/⌘ Z)" disabled>Undo</button>
      <button id="b-redo" data-act="redo" title="Redo (Ctrl/⌘ Shift Z)" disabled>Redo</button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="grp" role="group" aria-label="Export">
      <span class="grp-label">Export</span>
      <button data-act="export-png">PNG</button>
      <button data-act="export-svg">SVG</button>
      <button data-act="export-json">JSON</button>
      <label class="btn" title="Load a graph exported as JSON"><input id="f-import" type="file" accept="application/json,.json" hidden>Import</label>
    </div>
    <span id="status" class="status">Saved version</span>
    <button id="b-save" class="primary" data-act="save" disabled title="Saving works on the published page">Save version</button>
  </header>
  <main>
    <div class="stage" id="stage">
      <svg id="cv" class="fg" aria-label="Knowledge graph canvas"></svg>
      <div id="hint" class="hint" hidden>Click the start circle, then the end circle. Press Esc to finish.</div>
      <div class="zoom">
        <button data-act="zoom-out" aria-label="Zoom out">−</button>
        <output id="zoomv">100%</output>
        <button data-act="zoom-in" aria-label="Zoom in">+</button>
        <button data-act="zoom-fit" title="Fit the figure in view (F)">Fit</button>
      </div>
    </div>
    <aside class="panel" id="panel" aria-label="Inspector"></aside>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

let cam = {x: -40, y: -40, w: 2260, h: 1540};
function applyCam() {
  cv.setAttribute('viewBox', `${r1(cam.x)} ${r1(cam.y)} ${r1(cam.w)} ${r1(cam.h)}`);
  const w = cv.clientWidth || 1;
  $('zoomv').textContent = Math.round(w / cam.w * 100) + '%';
}
function fit() {
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
  const pad = 40, bw = state.board.w + pad * 2, bh = state.board.h + pad * 2, ar = h / w;
  let vw = bw, vh = bw * ar; if (vh < bh) { vh = bh; vw = bh / ar; }
  cam = {x: -pad - (vw - bw) / 2, y: -pad - (vh - bh) / 2, w: vw, h: vh}; applyCam();
}
function zoomAt(k, px, py) {
  const rect = cv.getBoundingClientRect();
  const nw = Math.min(20000, Math.max(200, cam.w * k)); k = nw / cam.w;
  const fx = (px - rect.left) / rect.width, fy = (py - rect.top) / rect.height;
  const wx = cam.x + fx * cam.w, wy = cam.y + fy * cam.h;

}

const snapshot = () => JSON.stringify({board: state.board, legend: state.legend, opts: state.opts, nodes: state.nodes, edges: state.edges});

function edit(key, fn) {
  const now = Date.now();

  lastKey = key; lastT = now; fn(); markDirty();
}
function restore(snap) {
  Object.assign(state, JSON.parse(snap)); reindex();
  sel.nodes = new Set([...sel.nodes].filter(id => byId[id]));
  if (sel.edge && !state.edges.some(e => e.id === sel.edge)) sel.edge = null;
  renderAll(); markDirty();
}

  if (!files.length) { toast('Choose PNG, JPG, WebP or GIF photos.'); return; }
  const T = photoTargets(), DF = {};
  T.forEach(t => new Set(ptoks(t.name)).forEach(w => { DF[w] = (DF[w] || 0) + 1; }));
  pushHistory(snapshot()); lastKey = null;
  let placed = 0; const taken = new Set(), left = [];
  for (let i = 0; i < files.length; i++) {
    statusUI(`Adding photos: ${i + 1} of ${files.length}…`);
    const f = files[i], t = matchFile(f.name, T, DF), key = t && t.node + '|' + t.alt;
    if (!t || taken.has(key)) { left.push(f); continue; }
    try { applyImg(t, await storeImage(f)); taken.add(key); placed++; if (t.alt < 0) updateNode(t.node); }
    catch (err) { left.push(f); }
  }
  left.forEach(f => tray.push({id: uid('p'), file: f, url: URL.createObjectURL(f), name: f.name}));
  markDirty(); statusUI(); select({});
  toast(`Placed ${placed} photo${placed === 1 ? '' : 's'}.` + (left.length ? ` ${left.length} need a case chosen in the side panel.` : ''));
}
async function placeTray(pid, val) {
  const p = tray.find(x => x.id === pid); if (!p) return;
  const [node, alt] = val.split('|'), t = {node, alt: +alt};
  statusUI('Adding image…');
  try { const img = await storeImage(p.file); edit(null, () => applyImg(t, img)); }
  catch (err) { statusUI(); toast('This image could not be read. Try saving it as PNG or JPG first.'); return; }
  URL.revokeObjectURL(p.url); tray = tray.filter(x => x !== p);
  if (t.alt < 0) updateNode(node); statusUI(); renderPanel();
}
$('f-photos').addEventListener('change', ev => { const fs = [...(ev.target.files || [])]; ev.target.value = ''; importPhotos(fs); });
const stage = $('stage');
stage.addEventListener('dragover', ev => {
  if (!ev.dataTransfer || ![...ev.dataTransfer.types].includes('Files')) return;
  ev.preventDefault(); const id = nodeAt(ev.clientX, ev.clientY);
  ev.dataTransfer.dropEffect = id ? 'copy' : 'none';
  if (id !== dropTarget) { dropTarget = id; drawOverlay(); }
});
stage.addEventListener('dragleave', ev => { if (!stage.contains(ev.relatedTarget)) { dropTarget = null; drawOverlay(); } });
stage.addEventListener('drop', ev => {
  ev.preventDefault();
  const id = nodeAt(ev.clientX, ev.clientY); dropTarget = null; drawOverlay();
  const files = ev.dataTransfer ? [...ev.dataTransfer.files].filter(f => f.type.startsWith('image/')) : [];
  if (!files.length) return;
  if (files.length > 1 || !id) { importPhotos(files); return; }
  select({nodes: new Set([id])}); setNodeImage(id, files[0]);
});
document.addEventListener('paste', ev => {
  const file = ev.clipboardData && [...ev.clipboardData.files].find(f => f.type.startsWith('image/'));
  if (!file) return;
  const n = curNode();
  if (!n) { toast('Select one circle first, then paste the image.'); return; }
  ev.preventDefault(); setNodeImage(n.id, file);
});

// ---------- export ----------
async function inlineImages() {
  const out = {}; let failed = 0;
  for (const n of state.nodes) {
    const src = imgSrc(n); if (!src) continue;
    if (src.startsWith('data:')) { out[n.id] = src; continue; }
    try { const r = await fetch(src); if (!r.ok) throw 0; out[n.id] = await toDataURL(await r.blob()); } catch (e) { out[n.id] = null; failed++; }
  }
  return {out, failed};
}
async function buildSVG() {
  const {out, failed} = await inlineImages();
  const W = state.board.w, H = state.board.h;
  const svg = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><style>${figCSS('')}</style>${MARKERS}</defs><rect width="${W}" height="${H}" fill="#ffffff"/><g id="links">${state.edges.map(e => edgeMarkup(e, false)).join('')}</g><g id="nodes">${state.nodes.map(n => nodeMarkup(n, true, n.img ? out[n.id] : null)).join('')}</g>${legendMarkup(false)}</svg>`;
  if (failed) toast(`${failed} image${failed > 1 ? 's' : ''} could not be included in the export.`);
  return svg;
}
async function offer(filename, blob) {
  const dl = CAP.downloads;
  if (dl) {
    try { await dl.save({filename, data: blob}); toast(`Saved ${filename}.`); }
    catch (err) { if (err && err.code === 'declined') return; toast(err && err.code === 'rate_limited' ? 'A save prompt is already open.' : 'Downloads are not available in this view.'); }
    return;
  }
  if (inFrame) { toast(CAP.downloads === undefined ? 'Still connecting. Try again in a moment.' : 'Downloads are not available in this view.'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}
async function exportSVGFile() { statusUI('Preparing SVG…'); try { await offer('prototype-graph.svg', new Blob([await buildSVG()], {type: 'image/svg+xml'})); } finally { statusUI(); } }
async function exportPNG() {
  statusUI('Preparing PNG…');
  try {
    const svg = await buildSVG(), scale = state.opts.pngScale || 2;
    const url = URL.createObjectURL(new Blob([svg], {type: 'image/svg+xml'}));
    const img = new Image(); img.src = url; await img.decode();
    const c = document.createElement('canvas'); c.width = state.board.w * scale; c.height = state.board.h * scale;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(res => c.toBlob(res, 'image/png'));
    if (!blob) throw new Error('canvas');
    await offer('prototype-graph.png', blob);
  } catch (err) { toast('PNG export failed in this browser. Export SVG instead.'); }
  finally { statusUI(); }
}

// ---------- save a new version of this page ----------
function buildDocument(st) {
  const json = JSON.stringify(st).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
    + SRC.pre + '<style id="css">' + SRC.css + '</style>' + SRC.shell
    + '<script type="application/json" id="graph-data">' + json + SC
    + '<script id="app">' + SRC.app + SC + '</body></html>';
}
async function save() {
  const art = CAP.artifact; if (!art || readOnly) return;
  const st = JSON.parse(JSON.stringify(state)); st.savedAt = new Date().toISOString();
  $('b-save').disabled = true; statusUI('Saving…');
  try {
    await art.publish(buildDocument(st));
    try { localStorage.removeItem(DKEY); } catch (e) { /* ignore */ }
    dirty = false; statusUI('Saved. Reloading…');
  } catch (err) {
    const c = err && err.code;
    if (c === 'conflict') toast('A newer version was saved elsewhere. The page is reloading to it.');
    else if (['not_writer', 'not_granted', 'consent_required', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { readOnly = true; toast('This view can’t save. Export JSON to keep your edits.'); }
    else if (c === 'too_large') toast('The page is too large to save. Replace embedded images with smaller ones.');
    else if (c === 'rate_limited') toast('Saving too often. Wait a moment, then save again.');
    else toast('Saving failed. Try again in a moment.');
    statusUI(); capsUI();
  }
}

// ---------- photos published next to the page (GitHub copy): photos/manifest.json ----------
async function loadManifest() {
  let m; try { const r = await fetch('photos/manifest.json', {cache: 'no-store'}); if (!r.ok) return; m = await r.json(); } catch (e) { return; }
  let k = 0;
  const put = (o, h) => { if (h && h.path && !o.img) { o.img = {src: h.path, z: 1, ox: 0, oy: 0, credit: {author: h.author, license: h.license, page: h.page, from: h.from}}; k++; } };
  state.nodes.forEach(n => { if (n.t !== 'case') return; put(n, m[n.name]); (n.alts || []).forEach(a => put(a, m[a.name])); });
  if (k) { renderAll(); }
}
if (!window.claude) { $('b-save').hidden = true; }

// ---------- start ----------
histUI(); capsUI(); renderAll(); fit(); statusUI(); loadManifest();
if (restored) toast('Restored your unsaved edits from this browser.');
})();
